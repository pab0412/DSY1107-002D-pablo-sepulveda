version: '3.8'

services:
  # 1. Broker de RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"   # Puerto AMQP
      - "15672:15672" # Interfaz web de administración
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend Spring Boot
  backend:
    build: ./rabbitmq-tutorials
    container_name: rabbitmq-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 3. Frontend React
  frontend:
    build: ./rabbitmq
    container_name: rabbitmq-frontend
    ports:
      - "5173:80"   # Acceso desde el navegador en http://localhost:5173
    depends_on:
      - backend